<head>

    <!-- Primary Meta Tags -->

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://davetasyon.vercel.app/">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://davetasyon.vercel.app/">
    <meta property="twitter:title" content="Davetasyon | Eşsiz Davetiye Konseptleri">

    <!-- Canonical -->
    <link rel="canonical" href="https://davetasyon.vercel.app/" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Davetasyon tasarım tokenları — tek kaynak.
        // Renk veya font değişikliği buradan yapılır; bileşenler token adıyla kullanır.
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0F0E0C',
                        surface: '#171614',
                        'surface-2': '#1F1D1A',
                        ivory: '#F7F3EA',
                        'ivory-muted': '#B9B2A6',
                        gold: '#C9A87C',
                        'gold-light': '#E3C9A4',
                        'gold-deep': '#7E6340',
                        pos: '#7D9A6E',
                        neg: '#C0756C',
                        warn: '#A79E8F'
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'system-ui', 'sans-serif'],
                        // Uzun başlıklar: gerçek italik serif
                        serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
                        // Marka adı, üst etiketler, fiyat
                        display: ['Cinzel', 'serif'],
                        script: ['"Great Vibes"', 'cursive']
                    }
                }
            }
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0F0E0C;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        ::selection {
            background: rgba(201, 168, 124, 0.28);
            color: #F7F3EA;
        }
        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-script { font-family: 'Great Vibes', cursive; }
        .font-cormorant { font-family: 'Cormorant Garamond', Georgia, serif; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(247, 243, 234, 0.03);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 124, 0.22);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(201, 168, 124, 0.45);
        }

        /* Hesaplayıcı: altın slider başparmağı */
        .lux-range { outline: none; }
        .lux-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #C9A87C;
            border: 2px solid #0F0E0C;
            box-shadow: 0 0 0 1px rgba(201, 168, 124, 0.55);
            cursor: pointer;
        }
        .lux-range::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #C9A87C;
            border: 2px solid #0F0E0C;
            cursor: pointer;
        }
        .lux-range:focus-visible::-webkit-slider-thumb {
            box-shadow: 0 0 0 4px rgba(201, 168, 124, 0.28);
        }
        #calculator { scroll-margin-top: 96px; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
